<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orb Collection</title>
    <style>
        /* Remove default spacing */
body {
    margin: 0;
    padding: 0;
    background: #1e1e1e;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

/* Title styling */
h1 {
    margin-top: 20px;
}

/* Center the canvas */
canvas {
    display: block;
    margin: 20px auto;
    border: 3px solid rgb(0, 0, 0);
    background: #87CEEB; /* sky color */
}
.platforms{
    background-color: black;
}

/* .coin{
    background-color: rgba(rgb(40, 13, 13), rgb(124, 213, 80), blue, .5);
    width: 5px;
    height: 5px;
    rotate: 45;
} */
    </style>
</head>
<body>
    <p id="timer"></p>
    <canvas id="Canvas" width="750px" height="750px"></canvas>
    <div>collect as many coins as possible using Arrow keys to go left and right with space bar to jump
    </div>
    <p>Score: <span id="score">0</span></p>

    <script>
        const canvas = document.getElementById("Canvas");
const ctx = canvas.getContext("2d");

const gravity = .5;
let score = 0;
const scoreDisplay = document.getElementById("score");

function isColliding(a, b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}
const player = {
    x: 100,
    y: 100,
    width: 30,
    height: 30,
    vx: 0,
    vy: 0,
    speed: 4,
    jump: -10,
    onground: false
};

const platforms = [
    { x: 300, y: 100, width: 150, height: 10, vx: (Math.random()*6) + 4 },
    { x: 250, y: 150, width: 150, height: 10, vx: (Math.random()*6) + 4 },
    { x: 200, y: 200, width: 150, height: 10, vx: (Math.random()*6) + 4 },
    { x: 200, y: 250, width: 150, height: 10, vx: (Math.random()*6) + 4 },
    { x: 0, y: 300, width: 150, height: 10, vx: (Math.random()*6) + 4},
    { x: 0, y: 350, width: 150, height: 10, vx: (Math.random()*6) + 4 },
    { x: 100, y: 400, width: 150, height: 10, vx: (Math.random()*6) +4 },
    { x: 200, y: 450, width: 150, height: 10, vx: (Math.random()*6) + 4 },
    { x: 350, y: 500, width: 150, height: 10, vx: (Math.random()*6) + 4 },   
    { x: 200, y: 550, width: 150, height: 10, vx: (Math.random()*6) + 4},
    { x: 0, y: 600, width: 150, height: 10, vx: (Math.random()*6) + 4},
    { x: 800, y: 650, width:150, height:10, vx: (Math.random()*2) + 4},
    { x: 0, y: 675, width:150, height: 10,  vx: (Math.random()*2) + 4},
    { x: 0, y: 730, width:150, height:10, vx: .5},
];

const keys = {};

window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

function update() {
    // movement
    if (keys["ArrowLeft"]) player.vx = -player.speed;
    else if (keys["ArrowRight"]) player.vx = player.speed;
    else player.vx = 0;

    // jump (spacebar)
    if (keys[" "] && player.onground) {
        player.vy = player.jump;
        player.onground = false;
    }

    // gravity
    player.vy += gravity;

    player.x += player.vx;
    player.y += player.vy;

    player.onground = false;

    // move platforms
    platforms.forEach(p => {
        p.x += p.vx;

        if (p.x < 0 || p.x + p.width > canvas.width) {
            p.vx *= -1;
        }
    });

    // collision
    platforms.forEach(p => {
        if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y
        ) {
            if (player.vy > 0) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.onground = true;

                // move with platform
                player.x += p.vx;
            }
        }
    });

    // update coins
    coins.forEach(coin => {
        coin.update(player);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // player
    ctx.fillStyle = "blue";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // platforms
    ctx.fillStyle = "black";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
    });
    // draw coins
    coins.forEach(coin => {
        coin.draw(ctx);
    });
}
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

class Coin {
  constructor(x, y) {
    this.baseY = y;
    this.x = x;
    this.y = y;
    this.width = 20;
    this.height = 20;
    this.collected = false;
    this.time = 0;
  }

  update(player) {
    // animate (floating up and down)
    this.time += 0.05;
    this.y = this.baseY + Math.sin(this.time) * 5;

    // collision
    if (!this.collected && isColliding(player, this)) {
      this.respawn();
    }
  }

  respawn() {
    // Respawn at a random position within the canvas bounds
    this.x = Math.random() * (canvas.width - this.width);
    this.baseY = Math.random() * (canvas.height - this.height);
    this.collected = false;
    this.time = 0;
    score++;
    document.getElementById('score').innerText = score;
  }

  draw(ctx) {
    if (this.collected) return;

    // pulse effect (slight size change)
    const scale = 1 + Math.sin(this.time * 2) * 0.1;

    ctx.save();
    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
    ctx.scale(scale, scale);

    ctx.fillStyle = "gold";
    ctx.beginPath();
    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}
// Only 3 coins at a time
const coins = [];

for (let i = 0; i < 3; i++) {
  coins.push(
    new Coin(
      Math.random() * (canvas.width - 20),
      Math.random() * (canvas.height - 20)
    )
  );
}
gameLoop();
// Set target, calculate difference, update display
const endTime = new Date("Dec 31, 2025 23:59:59").getTime();
const timer = setInterval(() => {
  const now = new Date().getTime();
  const diff = endTime - now;

  // Calculate time units
  const d = Math.floor(diff / (1000 * 60 * 60 * 24));
  const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const s = Math.floor((diff % (1000 * 60)) / 1000);

  document.getElementById("timer").innerText = `${d}d ${h}h ${m}m ${s}s`;

  if (diff < 0) {
    clearInterval(timer);
    document.getElementById("timer").innerText = "EXPIRED";

  }
}, 30000);

    </script>
</body>
</html>
